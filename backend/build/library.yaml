# Hand-checked builds for the Elegoo kit. Pinpoint offers these when the judge asks for one of
# them, when the live planner can't produce a safe plan, or when Claude isn't available.
# Every plan here must pass backend.build.board.validate (tests/test_build_library.py checks it).
# `keywords` help match a spoken request without Claude.
#
# Layout conventions (same as the planner's): breadboard flat, long side toward the builder,
# holes A-E on the builder's side, rows 1-30 only, near rails: RAIL:N+ = 5 volts, RAIL:N- = GND.

projects:

  # ------------------------------------------------------------------ basics
  - id: blink_led
    title: Blinking light
    difficulty: basic
    keywords: [blink, led, light, flash, first, simple, hello]
    summary: An LED that blinks on and off every second. The classic first circuit.
    parts:
      - {ref: LED1, part: led_red}
      - {ref: R1, part: resistor_220}
    steps:
      - kind: wire
        why: Connects the Arduino's ground to the minus rail.
        connections: [{lead: end1, to: "UNO:GND"}, {lead: end2, to: "RAIL:N-"}]
      - kind: place
        ref: LED1
        why: The light itself. Current flows in the long leg and out the short leg.
        connections: [{lead: anode, to: E10}, {lead: cathode, to: E11}]
      - kind: place
        ref: R1
        why: The resistor limits the current so the LED doesn't burn out.
        connections: [{lead: end1, to: D11}, {lead: end2, to: "RAIL:N-"}]
      - kind: wire
        why: Pin 13 switches the LED on and off.
        connections: [{lead: end1, to: "UNO:D13"}, {lead: end2, to: D10}]
    libraries: []
    test: {type: serial, key: led, expect: varies, instruction: The light is blinking once a second now.}
    sketch: |
      const int LED_PIN = 13;
      void setup() {
        pinMode(LED_PIN, OUTPUT);
        Serial.begin(9600);
      }
      void loop() {
        digitalWrite(LED_PIN, HIGH);
        Serial.println("led=1");
        delay(500);
        digitalWrite(LED_PIN, LOW);
        Serial.println("led=0");
        delay(500);
      }

  - id: button_led
    title: Push-button light
    difficulty: basic
    keywords: [button, press, switch, push, doorbell]
    summary: Press the button and the LED lights up; let go and it turns off.
    parts:
      - {ref: SW1, part: button}
      - {ref: LED1, part: led_green}
      - {ref: R1, part: resistor_220}
    steps:
      - kind: wire
        why: Connects the Arduino's ground to the minus rail.
        connections: [{lead: end1, to: "UNO:GND"}, {lead: end2, to: "RAIL:N-"}]
      - kind: place
        ref: SW1
        why: The button connects its two sides together while you press it.
        connections: [{lead: leg_a, to: E15}, {lead: leg_b, to: F17}]
      - kind: wire
        why: Pin 2 reads the button.
        connections: [{lead: end1, to: "UNO:D2"}, {lead: end2, to: D15}]
      - kind: wire
        why: The other side of the button goes to ground, so pressing it pulls pin 2 low.
        connections: [{lead: end1, to: G17}, {lead: end2, to: "RAIL:N-"}]
      - kind: place
        ref: LED1
        why: The light.
        connections: [{lead: anode, to: E10}, {lead: cathode, to: E11}]
      - kind: place
        ref: R1
        why: Limits the LED current.
        connections: [{lead: end1, to: D11}, {lead: end2, to: "RAIL:N-"}]
      - kind: wire
        why: Pin 8 powers the LED.
        connections: [{lead: end1, to: "UNO:D8"}, {lead: end2, to: D10}]
    libraries: []
    test: {type: serial, key: button, expect: varies, instruction: Press and release the button a few times.}
    sketch: |
      const int BUTTON_PIN = 2;
      const int LED_PIN = 8;
      void setup() {
        pinMode(BUTTON_PIN, INPUT_PULLUP);
        pinMode(LED_PIN, OUTPUT);
        Serial.begin(9600);
      }
      void loop() {
        int pressed = digitalRead(BUTTON_PIN) == LOW ? 1 : 0;
        digitalWrite(LED_PIN, pressed ? HIGH : LOW);
        Serial.print("button=");
        Serial.println(pressed);
        delay(100);
      }

  - id: dimmer
    title: Light dimmer
    difficulty: basic
    keywords: [dimmer, dim, knob, brightness, potentiometer, fade]
    summary: Turn the knob to make the LED brighter or dimmer.
    parts:
      - {ref: POT1, part: potentiometer}
      - {ref: LED1, part: led_yellow}
      - {ref: R1, part: resistor_220}
    steps:
      - kind: wire
        why: Brings 5 volts to the plus rail.
        connections: [{lead: end1, to: "UNO:5V"}, {lead: end2, to: "RAIL:N+"}]
      - kind: wire
        why: Brings ground to the minus rail.
        connections: [{lead: end1, to: "UNO:GND"}, {lead: end2, to: "RAIL:N-"}]
      - kind: place
        ref: POT1
        why: The knob. Its middle leg gives a voltage that follows the knob.
        connections: [{lead: left, to: E20}, {lead: wiper, to: E21}, {lead: right, to: E22}]
      - kind: wire
        why: One end of the knob to 5 volts.
        connections: [{lead: end1, to: D20}, {lead: end2, to: "RAIL:N+"}]
      - kind: wire
        why: The other end of the knob to ground.
        connections: [{lead: end1, to: D22}, {lead: end2, to: "RAIL:N-"}]
      - kind: wire
        why: Analog pin A0 reads the knob.
        connections: [{lead: end1, to: D21}, {lead: end2, to: "UNO:A0"}]
      - kind: place
        ref: LED1
        why: The light.
        connections: [{lead: anode, to: E10}, {lead: cathode, to: E11}]
      - kind: place
        ref: R1
        why: Limits the LED current.
        connections: [{lead: end1, to: D11}, {lead: end2, to: "RAIL:N-"}]
      - kind: wire
        why: Pin 9 can dim the LED by switching it very fast.
        connections: [{lead: end1, to: "UNO:D9"}, {lead: end2, to: D10}]
    libraries: []
    test: {type: serial, key: knob, expect: varies, instruction: Turn the knob slowly from one end to the other.}
    sketch: |
      const int KNOB_PIN = A0;
      const int LED_PIN = 9;
      void setup() {
        pinMode(LED_PIN, OUTPUT);
        Serial.begin(9600);
      }
      void loop() {
        int knob = analogRead(KNOB_PIN);
        analogWrite(LED_PIN, knob / 4);
        Serial.print("knob=");
        Serial.println(knob);
        delay(100);
      }

  - id: night_light
    title: Automatic night light
    difficulty: basic
    keywords: [night, dark, light sensor, photoresistor, automatic, lamp]
    summary: The LED switches on by itself when it gets dark.
    parts:
      - {ref: LDR1, part: photoresistor}
      - {ref: R1, part: resistor_10k}
      - {ref: LED1, part: led_white}
      - {ref: R2, part: resistor_220}
    steps:
      - kind: wire
        why: Brings 5 volts to the plus rail.
        connections: [{lead: end1, to: "UNO:5V"}, {lead: end2, to: "RAIL:N+"}]
      - kind: wire
        why: Brings ground to the minus rail.
        connections: [{lead: end1, to: "UNO:GND"}, {lead: end2, to: "RAIL:N-"}]
      - kind: place
        ref: LDR1
        why: The light sensor. More light lets more current through.
        connections: [{lead: end1, to: E15}, {lead: end2, to: E16}]
      - kind: wire
        why: Powers the light sensor.
        connections: [{lead: end1, to: D15}, {lead: end2, to: "RAIL:N+"}]
      - kind: place
        ref: R1
        why: With the sensor, makes a voltage that rises with the light.
        connections: [{lead: end1, to: D16}, {lead: end2, to: "RAIL:N-"}]
      - kind: wire
        why: Analog pin A0 reads the light level.
        connections: [{lead: end1, to: C16}, {lead: end2, to: "UNO:A0"}]
      - kind: place
        ref: LED1
        why: The night light.
        connections: [{lead: anode, to: E10}, {lead: cathode, to: E11}]
      - kind: place
        ref: R2
        why: Limits the LED current.
        connections: [{lead: end1, to: D11}, {lead: end2, to: "RAIL:N-"}]
      - kind: wire
        why: Pin 9 switches the LED.
        connections: [{lead: end1, to: "UNO:D9"}, {lead: end2, to: D10}]
    libraries: []
    test: {type: serial, key: light, expect: varies, instruction: Cover the light sensor with your hand, then uncover it.}
    sketch: |
      const int SENSOR_PIN = A0;
      const int LED_PIN = 9;
      const int DARK = 400;
      void setup() {
        pinMode(LED_PIN, OUTPUT);
        Serial.begin(9600);
      }
      void loop() {
        int light = analogRead(SENSOR_PIN);
        digitalWrite(LED_PIN, light < DARK ? HIGH : LOW);
        Serial.print("light=");
        Serial.println(light);
        delay(100);
      }

  - id: traffic_light
    title: Traffic light
    difficulty: basic
    keywords: [traffic, stop, red yellow green, three leds, sequence]
    summary: Red, yellow and green LEDs that cycle like a real traffic light.
    parts:
      - {ref: LED1, part: led_red}
      - {ref: LED2, part: led_yellow}
      - {ref: LED3, part: led_green}
      - {ref: R1, part: resistor_220}
      - {ref: R2, part: resistor_220}
      - {ref: R3, part: resistor_220}
    steps:
      - kind: wire
        why: Brings ground to the minus rail.
        connections: [{lead: end1, to: "UNO:GND"}, {lead: end2, to: "RAIL:N-"}]
      - kind: place
        ref: LED1
        why: The red light.
        connections: [{lead: anode, to: E5}, {lead: cathode, to: E6}]
      - kind: place
        ref: R1
        why: Limits the red LED's current.
        connections: [{lead: end1, to: D6}, {lead: end2, to: "RAIL:N-"}]
      - kind: wire
        why: Pin 10 drives red.
        connections: [{lead: end1, to: "UNO:D10"}, {lead: end2, to: D5}]
      - kind: place
        ref: LED2
        why: The yellow light.
        connections: [{lead: anode, to: E10}, {lead: cathode, to: E11}]
      - kind: place
        ref: R2
        why: Limits the yellow LED's current.
        connections: [{lead: end1, to: D11}, {lead: end2, to: "RAIL:N-"}]
      - kind: wire
        why: Pin 9 drives yellow.
        connections: [{lead: end1, to: "UNO:D9"}, {lead: end2, to: D10}]
      - kind: place
        ref: LED3
        why: The green light.
        connections: [{lead: anode, to: E15}, {lead: cathode, to: E16}]
      - kind: place
        ref: R3
        why: Limits the green LED's current.
        connections: [{lead: end1, to: D16}, {lead: end2, to: "RAIL:N-"}]
      - kind: wire
        why: Pin 8 drives green.
        connections: [{lead: end1, to: "UNO:D8"}, {lead: end2, to: D15}]
    libraries: []
    test: {type: serial, key: phase, expect: varies, instruction: The lights are cycling green, yellow, red.}
    sketch: |
      const int RED = 10, YELLOW = 9, GREEN = 8;
      void show(int phase, int r, int y, int g, int ms) {
        digitalWrite(RED, r); digitalWrite(YELLOW, y); digitalWrite(GREEN, g);
        unsigned long until = millis() + ms;
        while (millis() < until) {
          Serial.print("phase=");
          Serial.println(phase);
          delay(200);
        }
      }
      void setup() {
        pinMode(RED, OUTPUT); pinMode(YELLOW, OUTPUT); pinMode(GREEN, OUTPUT);
        Serial.begin(9600);
      }
      void loop() {
        show(0, LOW, LOW, HIGH, 3000);
        show(1, LOW, HIGH, LOW, 1000);
        show(2, HIGH, LOW, LOW, 3000);
      }

  # ------------------------------------------------------------------ advanced
  - id: proximity_alarm
    title: Proximity alarm
    difficulty: advanced
    keywords: [distance, ultrasonic, proximity, close, near, parking, sonar, approach, intruder]
    summary: Beeps faster and lights up as something gets closer to the distance sensor, like a parking sensor.
    parts:
      - {ref: US1, part: hc_sr04}
      - {ref: BZ1, part: buzzer_active}
      - {ref: LED1, part: led_red}
      - {ref: R1, part: resistor_220}
    steps:
      - kind: wire
        why: Brings 5 volts to the plus rail.
        connections: [{lead: end1, to: "UNO:5V"}, {lead: end2, to: "RAIL:N+"}]
      - kind: wire
        why: Brings ground to the minus rail.
        connections: [{lead: end1, to: "UNO:GND"}, {lead: end2, to: "RAIL:N-"}]
      - kind: place
        ref: US1
        why: The distance sensor sends a chirp from one eye and listens for the echo with the other.
        connections: [{lead: VCC, to: E20}, {lead: Trig, to: E21}, {lead: Echo, to: E22}, {lead: GND, to: E23}]
      - kind: wire
        why: Powers the sensor.
        connections: [{lead: end1, to: D20}, {lead: end2, to: "RAIL:N+"}]
      - kind: wire
        why: Pin 7 tells the sensor to chirp.
        connections: [{lead: end1, to: D21}, {lead: end2, to: "UNO:D7"}]
      - kind: wire
        why: Pin 6 times the echo.
        connections: [{lead: end1, to: D22}, {lead: end2, to: "UNO:D6"}]
      - kind: wire
        why: Grounds the sensor.
        connections: [{lead: end1, to: D23}, {lead: end2, to: "RAIL:N-"}]
      - kind: place
        ref: BZ1
        why: The beeper.
        connections: [{lead: positive, to: E10}, {lead: negative, to: E11}]
      - kind: wire
        why: Pin 8 switches the beeper.
        connections: [{lead: end1, to: "UNO:D8"}, {lead: end2, to: D10}]
      - kind: wire
        why: Grounds the beeper.
        connections: [{lead: end1, to: D11}, {lead: end2, to: "RAIL:N-"}]
      - kind: place
        ref: LED1
        why: A warning light.
        connections: [{lead: anode, to: E5}, {lead: cathode, to: E6}]
      - kind: place
        ref: R1
        why: Limits the LED current.
        connections: [{lead: end1, to: D6}, {lead: end2, to: "RAIL:N-"}]
      - kind: wire
        why: Pin 9 switches the warning light.
        connections: [{lead: end1, to: "UNO:D9"}, {lead: end2, to: D5}]
    libraries: []
    test: {type: serial, key: dist, expect: varies, instruction: Move your hand slowly toward the sensor's eyes, then away.}
    sketch: |
      const int TRIG = 7, ECHO = 6, BUZZER = 8, LED = 9;
      long readCm() {
        digitalWrite(TRIG, LOW); delayMicroseconds(2);
        digitalWrite(TRIG, HIGH); delayMicroseconds(10);
        digitalWrite(TRIG, LOW);
        long us = pulseIn(ECHO, HIGH, 30000);
        return us == 0 ? 0 : us / 58;
      }
      void setup() {
        pinMode(TRIG, OUTPUT); pinMode(ECHO, INPUT);
        pinMode(BUZZER, OUTPUT); pinMode(LED, OUTPUT);
        Serial.begin(9600);
      }
      void loop() {
        long cm = readCm();
        Serial.print("dist=");
        Serial.println(cm);
        if (cm > 0 && cm < 60) {
          digitalWrite(BUZZER, HIGH); digitalWrite(LED, HIGH);
          delay(40);
          digitalWrite(BUZZER, LOW); digitalWrite(LED, LOW);
          delay(cm * 6);
        } else {
          delay(100);
        }
      }

  - id: servo_knob
    title: Knob-controlled servo
    difficulty: advanced
    keywords: [servo, motor, arm, knob, turn, rotate, steer, robot]
    summary: Turn the knob and the servo arm follows it, like a remote-control steering wheel.
    parts:
      - {ref: POT1, part: potentiometer}
      - {ref: M1, part: servo}
    steps:
      - kind: wire
        why: Brings 5 volts to the plus rail.
        connections: [{lead: end1, to: "UNO:5V"}, {lead: end2, to: "RAIL:N+"}]
      - kind: wire
        why: Brings ground to the minus rail.
        connections: [{lead: end1, to: "UNO:GND"}, {lead: end2, to: "RAIL:N-"}]
      - kind: place
        ref: POT1
        why: The knob.
        connections: [{lead: left, to: E20}, {lead: wiper, to: E21}, {lead: right, to: E22}]
      - kind: wire
        why: One end of the knob to 5 volts.
        connections: [{lead: end1, to: D20}, {lead: end2, to: "RAIL:N+"}]
      - kind: wire
        why: The other end to ground.
        connections: [{lead: end1, to: D22}, {lead: end2, to: "RAIL:N-"}]
      - kind: wire
        why: A0 reads the knob.
        connections: [{lead: end1, to: D21}, {lead: end2, to: "UNO:A0"}]
      - kind: place
        ref: M1
        why: The servo turns its arm to the angle pin 9 asks for.
        connections: [{lead: GND, to: "RAIL:N-"}, {lead: VCC, to: "RAIL:N+"}, {lead: signal, to: "UNO:D9"}]
    libraries: [Servo]
    test: {type: serial, key: angle, expect: varies, instruction: Turn the knob and feel the servo arm follow it.}
    sketch: |
      #include <Servo.h>
      Servo arm;
      void setup() {
        arm.attach(9);
        Serial.begin(9600);
      }
      void loop() {
        int angle = map(analogRead(A0), 0, 1023, 0, 180);
        arm.write(angle);
        Serial.print("angle=");
        Serial.println(angle);
        delay(50);
      }

