  - id: clap_light
    title: Clap-activated light
    difficulty: advanced
    keywords: [clap, sound, noise, loud, microphone, voice, music]
    summary: Clap your hands to switch the light on, and clap again to switch it off.
    parts:
      - {ref: MIC1, part: sound_sensor}
      - {ref: LED1, part: led_blue}
      - {ref: R1, part: resistor_220}
    steps:
      - kind: wire
        why: Brings 5 volts to the plus rail.
        connections: [{lead: end1, to: "UNO:5V"}, {lead: end2, to: "RAIL:N+"}]
      - kind: wire
        why: Brings ground to the minus rail.
        connections: [{lead: end1, to: "UNO:GND"}, {lead: end2, to: "RAIL:N-"}]
      - kind: place
        ref: MIC1
        why: The sound sensor turns noise into a voltage.
        connections: [{lead: AO, to: "UNO:A0"}, {lead: GND, to: "RAIL:N-"}, {lead: VCC, to: "RAIL:N+"}, {lead: DO, to: "UNO:D2"}]
      - kind: place
        ref: LED1
        why: The light.
        connections: [{lead: anode, to: E10}, {lead: cathode, to: E11}]
      - kind: place
        ref: R1
        why: Limits the LED current.
        connections: [{lead: end1, to: D11}, {lead: end2, to: "RAIL:N-"}]
      - kind: wire
        why: Pin 9 switches the light.
        connections: [{lead: end1, to: "UNO:D9"}, {lead: end2, to: D10}]
    libraries: []
    test: {type: serial, key: sound, expect: varies, instruction: Clap your hands once, close to the microphone.}
    sketch: |
      const int MIC = A0, LED = 9;
      int baseline = 0;
      bool on = false;
      unsigned long lastClap = 0;
      void setup() {
        pinMode(LED, OUTPUT);
        Serial.begin(9600);
        long sum = 0;
        for (int i = 0; i < 100; i++) { sum += analogRead(MIC); delay(2); }
        baseline = sum / 100;
      }
      void loop() {
        int peak = 0;
        unsigned long start = millis();
        while (millis() - start < 50) {
          int v = abs(analogRead(MIC) - baseline);
          if (v > peak) peak = v;
        }
        if (peak > 60 && millis() - lastClap > 400) {
          on = !on;
          lastClap = millis();
          digitalWrite(LED, on ? HIGH : LOW);
        }
        Serial.print("sound=");
        Serial.println(peak);
      }

  - id: mood_lamp
    title: Colour-changing mood lamp
    difficulty: advanced
    keywords: [rgb, colour, color, mood, rainbow, lamp, hue]
    summary: Turn the knob to sweep an RGB LED through every colour of the rainbow.
    parts:
      - {ref: RGB1, part: rgb_led}
      - {ref: R1, part: resistor_220}
      - {ref: R2, part: resistor_220}
      - {ref: R3, part: resistor_220}
      - {ref: POT1, part: potentiometer}
    steps:
      - kind: wire
        why: Brings 5 volts to the plus rail.
        connections: [{lead: end1, to: "UNO:5V"}, {lead: end2, to: "RAIL:N+"}]
      - kind: wire
        why: Brings ground to the minus rail.
        connections: [{lead: end1, to: "UNO:GND"}, {lead: end2, to: "RAIL:N-"}]
      - kind: place
        ref: RGB1
        why: Three LEDs in one bulb, sharing one ground leg.
        connections: [{lead: red, to: E10}, {lead: cathode, to: E11}, {lead: green, to: E12}, {lead: blue, to: E13}]
      - kind: wire
        why: Grounds the shared leg.
        connections: [{lead: end1, to: D11}, {lead: end2, to: "RAIL:N-"}]
      - kind: place
        ref: R1
        why: The red resistor bridges the groove.
        connections: [{lead: end1, to: D10}, {lead: end2, to: F10}]
      - kind: place
        ref: R2
        why: The green resistor bridges the groove.
        connections: [{lead: end1, to: D12}, {lead: end2, to: F12}]
      - kind: place
        ref: R3
        why: The blue resistor bridges the groove.
        connections: [{lead: end1, to: D13}, {lead: end2, to: F13}]
      - kind: wire
        why: Pin 9 drives red.
        connections: [{lead: end1, to: G10}, {lead: end2, to: "UNO:D9"}]
      - kind: wire
        why: Pin 10 drives green.
        connections: [{lead: end1, to: G12}, {lead: end2, to: "UNO:D10"}]
      - kind: wire
        why: Pin 11 drives blue.
        connections: [{lead: end1, to: G13}, {lead: end2, to: "UNO:D11"}]
      - kind: place
        ref: POT1
        why: The colour knob.
        connections: [{lead: left, to: E20}, {lead: wiper, to: E21}, {lead: right, to: E22}]
      - kind: wire
        why: One end of the knob to 5 volts.
        connections: [{lead: end1, to: D20}, {lead: end2, to: "RAIL:N+"}]
      - kind: wire
        why: The other end to ground.
        connections: [{lead: end1, to: D22}, {lead: end2, to: "RAIL:N-"}]
      - kind: wire
        why: A0 reads the knob.
        connections: [{lead: end1, to: D21}, {lead: end2, to: "UNO:A0"}]
    libraries: []
    test: {type: serial, key: hue, expect: varies, instruction: Turn the knob slowly to change the colour.}
    sketch: |
      const int RP = 9, GP = 10, BP = 11;
      void setup() {
        pinMode(RP, OUTPUT); pinMode(GP, OUTPUT); pinMode(BP, OUTPUT);
        Serial.begin(9600);
      }
      void loop() {
        int hue = map(analogRead(A0), 0, 1023, 0, 767);
        int r, g, b;
        if (hue < 256)      { r = 255 - hue; g = hue;       b = 0; }
        else if (hue < 512) { r = 0;         g = 511 - hue; b = hue - 256; }
        else                { r = hue - 512; g = 0;         b = 767 - hue; }
        analogWrite(RP, r); analogWrite(GP, g); analogWrite(BP, b);
        Serial.print("hue=");
        Serial.println(hue);
        delay(50);
      }

  - id: reaction_game
    title: Reaction-time game
    difficulty: advanced
    keywords: [game, reaction, reflex, speed, fast, quick, timer, challenge]
    summary: After a random wait it beeps and lights up; press the button as fast as you can and it tells you your time.
    parts:
      - {ref: SW1, part: button}
      - {ref: LED1, part: led_green}
      - {ref: R1, part: resistor_220}
      - {ref: BZ1, part: buzzer_active}
    steps:
      - kind: wire
        why: Brings ground to the minus rail.
        connections: [{lead: end1, to: "UNO:GND"}, {lead: end2, to: "RAIL:N-"}]
      - kind: place
        ref: SW1
        why: Your reaction button.
        connections: [{lead: leg_a, to: E20}, {lead: leg_b, to: F22}]
      - kind: wire
        why: Pin 2 reads the button.
        connections: [{lead: end1, to: D20}, {lead: end2, to: "UNO:D2"}]
      - kind: wire
        why: The other side of the button to ground.
        connections: [{lead: end1, to: G22}, {lead: end2, to: "RAIL:N-"}]
      - kind: place
        ref: LED1
        why: The go light.
        connections: [{lead: anode, to: E10}, {lead: cathode, to: E11}]
      - kind: place
        ref: R1
        why: Limits the LED current.
        connections: [{lead: end1, to: D11}, {lead: end2, to: "RAIL:N-"}]
      - kind: wire
        why: Pin 9 switches the light.
        connections: [{lead: end1, to: "UNO:D9"}, {lead: end2, to: D10}]
      - kind: place
        ref: BZ1
        why: The go beep.
        connections: [{lead: positive, to: E15}, {lead: negative, to: E16}]
      - kind: wire
        why: Pin 8 switches the beeper.
        connections: [{lead: end1, to: "UNO:D8"}, {lead: end2, to: D15}]
      - kind: wire
        why: Grounds the beeper.
        connections: [{lead: end1, to: D16}, {lead: end2, to: "RAIL:N-"}]
    libraries: []
    test: {type: serial, key: reaction, expect: present, instruction: Wait for the beep, then press the button as fast as you can.}
    sketch: |
      const int BUTTON = 2, BUZZER = 8, LED = 9;
      void setup() {
        pinMode(BUTTON, INPUT_PULLUP);
        pinMode(BUZZER, OUTPUT); pinMode(LED, OUTPUT);
        Serial.begin(9600);
        randomSeed(analogRead(A5));
      }
      void loop() {
        while (digitalRead(BUTTON) == LOW) delay(10);
        unsigned long wait = millis() + random(1500, 4000);
        while (millis() < wait) {
          if (digitalRead(BUTTON) == LOW) { Serial.println("early=1"); delay(1000); return; }
          Serial.println("waiting=1");
          delay(100);
        }
        digitalWrite(LED, HIGH); digitalWrite(BUZZER, HIGH);
        unsigned long start = millis();
        while (digitalRead(BUTTON) == HIGH && millis() - start < 5000) {}
        unsigned long ms = millis() - start;
        digitalWrite(LED, LOW); digitalWrite(BUZZER, LOW);
        Serial.print("reaction=");
        Serial.println(ms);
        delay(1500);
      }

  - id: water_alarm
    title: Flood alarm
    difficulty: advanced
    keywords: [water, flood, leak, rain, wet, plant, level]
    summary: Beeps when the water sensor gets wet, so you know about a leak or a full cup.
    parts:
      - {ref: WS1, part: water_sensor}
      - {ref: BZ1, part: buzzer_active}
    steps:
      - kind: wire
        why: Brings 5 volts to the plus rail.
        connections: [{lead: end1, to: "UNO:5V"}, {lead: end2, to: "RAIL:N+"}]
      - kind: wire
        why: Brings ground to the minus rail.
        connections: [{lead: end1, to: "UNO:GND"}, {lead: end2, to: "RAIL:N-"}]
      - kind: place
        ref: WS1
        why: The metal stripes conduct more when wet.
        connections: [{lead: S, to: "UNO:A0"}, {lead: VCC, to: "RAIL:N+"}, {lead: GND, to: "RAIL:N-"}]
      - kind: place
        ref: BZ1
        why: The alarm sound.
        connections: [{lead: positive, to: E10}, {lead: negative, to: E11}]
      - kind: wire
        why: Pin 8 switches the buzzer.
        connections: [{lead: end1, to: "UNO:D8"}, {lead: end2, to: D10}]
      - kind: wire
        why: Grounds the buzzer.
        connections: [{lead: end1, to: D11}, {lead: end2, to: "RAIL:N-"}]
    libraries: []
    test: {type: serial, key: water, expect: varies, instruction: Touch the striped end of the sensor with a wet finger, or dip it in a cup of water.}
    sketch: |
      const int SENSOR = A0, BUZZER = 8;
      void setup() {
        pinMode(BUZZER, OUTPUT);
        Serial.begin(9600);
      }
      void loop() {
