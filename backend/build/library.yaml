        connections: [{lead: GND, to: "RAIL:N-"}, {lead: VCC, to: "RAIL:N+"}, {lead: VRx, to: "UNO:A0"}, {lead: VRy, to: "UNO:A1"}, {lead: SW, to: "UNO:D2"}]
      - kind: place
